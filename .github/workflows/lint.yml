name: Lint

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

  govet:
    name: go vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run go vet
        env:
          GOTOOLCHAIN: local  # honour the pinned go-version; go.mod's toolchain directive replaces it otherwise
          GOWORK: off         # resolve dependencies from go.mod alone, the way a consumer does
        run: go vet ./...

      # The build and test jobs in ci.yml compile with -tags nokafka. Vetting
      # only the default configuration leaves that one unchecked, and a file
      # missing its //go:build constraint compiles here and fails there --
      # which is exactly how kafka_limits.go and kafka_diag.go took down Build
      # CLI, both test matrix entries and Integration while this job stayed
      # green. Catching it here costs a minute instead of five.
      - name: Run go vet (nokafka)
        env:
          GOTOOLCHAIN: local  # honour the pinned go-version; go.mod's toolchain directive replaces it otherwise
          GOWORK: off         # resolve dependencies from go.mod alone, the way a consumer does
        run: go vet -tags nokafka ./...
