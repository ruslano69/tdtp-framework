database:
  type: postgres
  host: localhost
  port: 5432
  database: tdtp
  user: tdtp
  password: tdtp
  schema: public
  sslmode: disable

broker:
  type: rabbitmq
  host: localhost
  port: 5672
  user: tdtp
  password: tdtp
  queue: tdtp.sync.countries
  durable: true

security:
    # xZMercury выдаёт ключ шифрования, привязанный к UUID пакета: ключ живёт
    # в памяти Mercury, в файл не попадает и одноразов. Экспортёр связывает
    # ключ при отправке, слушатель разрешает его при разборе — поэтому URL
    # нужен обеим сторонам, и держать его здесь надёжнее, чем повторять
    # флагом в восьми шагах workflow и в каждом слушателе.
    mercury_url: http://localhost:3077
